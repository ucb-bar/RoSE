#
# Virtual RoSE downward Time-of-Flight rangefinder (VL53L1x-equivalent). Fetches
# a 1-word [height] float32 above-ground distance from the RoSE bridge and exposes
# it as SENSOR_CHAN_DISTANCE (the same channel Zephyr's st,vl53l1x uses, so a real
# build binds DT_ALIAS(tof) to st,vl53l1x with zero app change).
#
# A real ToF samples slowly (~20-40 ms). This driver models that: sample_fetch()
# returns -EAGAIN except every `decimation` calls, so the estimator only fuses a
# fresh height at the low rate (multi-rate estimation).

description: RoSE co-sim virtual downward ToF rangefinder (low-rate height above ground)

compatible: "ucbbar,rose-tof"

include: sensor-device.yaml

properties:
  rose:
    type: phandle
    required: true
    description: The RoSE bridge adapter this sensor reads through.
  rose-cmd:
    type: int
    required: true
    description: RoSE reqrsp command ID that returns the 1-word [height] frame (e.g. 0x14).
  rose-channel:
    type: int
    required: true
    description: RoSE reqrsp RX channel the response lands on.
  decimation:
    type: int
    default: 6
    description: |
      Fetch cadence divisor vs the control loop: sample_fetch() reports a fresh
      sample (returns 0) every `decimation` calls and -EAGAIN otherwise. At 200 Hz
      control, 6 -> ~33 Hz ToF (~30 ms), matching a real rangefinder.
