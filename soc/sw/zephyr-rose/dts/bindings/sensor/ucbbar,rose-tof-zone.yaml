#
# Virtual RoSE multizone Time-of-Flight (ST VL53L5CX-equivalent). Each node fetches a
# zones-word float32 grid of above-surface distances (metres) from the RoSE bridge via its
# own reqrsp command and exposes the MIN zone on SENSOR_CHAN_DISTANCE (nearest obstacle in
# the FoV), the mean on ROSE_SENSOR_CHAN_TOF_ZONE_MEAN, and the full grid via
# rose_tof_zone_grid(). Bind one node per physical sensor (front/right/back/left) so a real
# build can swap the compatible to st,vl53l5cx unchanged (see docs/ROSE_FUTURE_SENSORS_PLAN.md).

description: RoSE co-sim virtual multizone ToF (VL53L5CX-equivalent)

compatible: "ucbbar,rose-tof-zone"

include: sensor-device.yaml

properties:
  rose:
    type: phandle
    required: true
    description: The RoSE bridge adapter (ucbbar,RoseAdapter) this sensor reads through.
  rose-cmd:
    type: int
    required: true
    description: RoSE reqrsp command ID that returns this sensor's zone grid (e.g. 0x30).
  rose-channel:
    type: int
    required: true
    description: RoSE reqrsp RX channel the response lands on (1 or 2).
  zones:
    type: int
    default: 64
    description: Number of zone words returned (e.g. 64 for an 8x8 grid, 16 for 4x4).
  decimation:
    type: int
    default: 13
    description: |
      Report a fresh grid only every Nth sample_fetch() (returns -EAGAIN otherwise), modeling
      the VL53L5CX's low 8x8 rate (~200 Hz control / 15 Hz -> 13).
